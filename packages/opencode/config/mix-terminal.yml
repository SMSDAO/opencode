# MIX Terminal Configuration
# This file defines the configuration for all MIX Terminal components

version: "1.0.0"

# SmartBrain Integration Configuration
smartbrain:
  enabled: true
  model: "gpt-4"
  features:
    - analysis
    - suggestions
    - automation
    - code-review
  settings:
    max_tokens: 4096
    temperature: 0.7
    timeout: 30000

# SolanaRemix Integration Configuration
solana_remix:
  enabled: true
  network: "devnet"
  rpc_url: "https://api.devnet.solana.com"
  features:
    - wallet
    - transactions
    - programs
    - tokens
  settings:
    commitment: "confirmed"
    timeout: 10000
    max_retries: 3

# SolanaRemix Terminal Configuration
terminal:
  enabled: true
  theme: "dark"
  features:
    - command-execution
    - history
    - autocomplete
    - syntax-highlighting
  settings:
    history_size: 1000
    font_size: 14
    line_height: 1.5
    cursor_style: "block"

# Automation Scripts Configuration
scripts:
  enabled: true
  auto_run:
    - smartbrain-init
  scheduled:
    - name: "daily-health-check"
      script: "full-integration"
      cron: "0 0 * * *"
  
  available:
    - name: "smartbrain-init"
      description: "Initialize SmartBrain module"
      enabled: true
    - name: "solana-setup"
      description: "Setup Solana environment"
      enabled: true
    - name: "terminal-config"
      description: "Configure terminal settings"
      enabled: true
    - name: "full-integration"
      description: "Run full integration test"
      enabled: true

# Logging Configuration
logging:
  level: "info"
  output: "console"
  file: "./logs/mix-terminal.log"
  format: "json"

# Performance Settings
performance:
  cache_enabled: true
  cache_ttl: 3600
  max_concurrent_operations: 10
  connection_pool_size: 5
