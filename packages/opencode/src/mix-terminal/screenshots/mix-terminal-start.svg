<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#1e1e1e"/>
  
  <!-- Terminal Window -->
  <rect x="20" y="20" width="760" height="460" rx="8" fill="#2d2d2d" stroke="#3e3e3e" stroke-width="2"/>
  
  <!-- Title Bar -->
  <rect x="20" y="20" width="760" height="35" rx="8" fill="#3e3e3e"/>
  <circle cx="40" cy="37.5" r="6" fill="#ff5f56"/>
  <circle cx="60" cy="37.5" r="6" fill="#ffbd2e"/>
  <circle cx="80" cy="37.5" r="6" fill="#27c93f"/>
  <text x="400" y="42" font-family="Arial, sans-serif" font-size="14" fill="#cccccc" text-anchor="middle">MIX Terminal - Start Command</text>
  
  <!-- Terminal Content -->
  <text x="40" y="80" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#4ec9b0">$</text>
  <text x="55" y="80" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#d4d4d4">opencode mix-terminal start</text>
  
  <!-- Output -->
  <text x="40" y="110" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#569cd6">◇</text>
  <text x="55" y="110" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#d4d4d4">🚀 MIX Terminal</text>
  
  <text x="40" y="140" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#4ec9b0">│</text>
  
  <text x="40" y="170" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#569cd6">◆</text>
  <text x="55" y="170" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#d4d4d4">Initializing MIX Terminal components...</text>
  
  <text x="40" y="200" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#4ec9b0">│</text>
  
  <text x="40" y="230" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#569cd6">◇</text>
  <text x="55" y="230" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#6a9955">✓</text>
  <text x="75" y="230" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#d4d4d4">MIX Terminal started with:</text>
  
  <text x="75" y="260" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#d4d4d4">@SmartBrain, @SolanaRemix, @SolanaRemix/terminal</text>
  
  <text x="40" y="290" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#4ec9b0">│</text>
  
  <text x="40" y="320" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#6a9955">✓</text>
  <text x="55" y="320" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#6a9955">All components initialized successfully</text>
  
  <text x="40" y="350" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#569cd6">ℹ</text>
  <text x="55" y="350" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#9cdcfe">Use 'opencode mix-terminal script run' to execute automated scripts</text>
  
  <text x="40" y="380" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#4ec9b0">│</text>
  
  <text x="40" y="410" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#569cd6">◇</text>
  <text x="55" y="410" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#d4d4d4">MIX Terminal is ready! 🎉</text>
  
  <text x="40" y="450" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#4ec9b0">$</text>
  <text x="55" y="450" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#d4d4d4">_</text>
</svg>
