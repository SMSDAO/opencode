<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#1e1e1e"/>
  
  <!-- Terminal Window -->
  <rect x="20" y="20" width="760" height="560" rx="8" fill="#2d2d2d" stroke="#3e3e3e" stroke-width="2"/>
  
  <!-- Title Bar -->
  <rect x="20" y="20" width="760" height="35" rx="8" fill="#3e3e3e"/>
  <circle cx="40" cy="37.5" r="6" fill="#ff5f56"/>
  <circle cx="60" cy="37.5" r="6" fill="#ffbd2e"/>
  <circle cx="80" cy="37.5" r="6" fill="#27c93f"/>
  <text x="400" y="42" font-family="Arial, sans-serif" font-size="14" fill="#cccccc" text-anchor="middle">MIX Terminal - Configuration</text>
  
  <!-- Terminal Content -->
  <text x="40" y="80" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#4ec9b0">$</text>
  <text x="55" y="80" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#d4d4d4">opencode mix-terminal config</text>
  
  <!-- Output -->
  <text x="40" y="110" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#569cd6">◇</text>
  <text x="55" y="110" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#d4d4d4">Configure MIX Terminal</text>
  
  <text x="40" y="140" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#4ec9b0">│</text>
  
  <text x="40" y="170" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#569cd6">◆</text>
  <text x="55" y="170" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#d4d4d4">Enable @SmartBrain integration?</text>
  <text x="70" y="190" font-family="Monaco, 'Courier New', monospace" font-size="12" fill="#6a9955">● Yes</text>
  <text x="140" y="190" font-family="Monaco, 'Courier New', monospace" font-size="12" fill="#808080">○ No</text>
  
  <text x="40" y="220" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#4ec9b0">│</text>
  
  <text x="40" y="250" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#569cd6">◆</text>
  <text x="55" y="250" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#d4d4d4">Enable @SolanaRemix integration?</text>
  <text x="70" y="270" font-family="Monaco, 'Courier New', monospace" font-size="12" fill="#6a9955">● Yes</text>
  <text x="140" y="270" font-family="Monaco, 'Courier New', monospace" font-size="12" fill="#808080">○ No</text>
  
  <text x="40" y="300" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#4ec9b0">│</text>
  
  <text x="40" y="330" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#569cd6">◆</text>
  <text x="55" y="330" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#d4d4d4">Enable @SolanaRemix/terminal integration?</text>
  <text x="70" y="350" font-family="Monaco, 'Courier New', monospace" font-size="12" fill="#6a9955">● Yes</text>
  <text x="140" y="350" font-family="Monaco, 'Courier New', monospace" font-size="12" fill="#808080">○ No</text>
  
  <text x="40" y="380" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#4ec9b0">│</text>
  
  <text x="40" y="410" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#6a9955">✓</text>
  <text x="55" y="410" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#6a9955">Configuration saved successfully</text>
  
  <text x="40" y="440" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#4ec9b0">│</text>
  
  <text x="40" y="470" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#569cd6">◇</text>
  <text x="55" y="470" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#d4d4d4">MIX Terminal configuration complete</text>
  
  <text x="40" y="510" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#4ec9b0">$</text>
  <text x="55" y="510" font-family="Monaco, 'Courier New', monospace" font-size="14" fill="#d4d4d4">_</text>
</svg>
